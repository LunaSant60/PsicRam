<!DOCTYPE html>
<html lang="es">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de datos</title>
  <style>
    :root {
      color-scheme: light;
      --guinda: #6d1a2c;
      --guinda-oscuro: #4e1220;
      --crema: #fbf6ef;
      --dorado: #c2a165;
      --tinta: #3a1d24;
      --tinta-suave: #6f5a5e;
      --borde: #d8c6b8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--tinta);
      background: var(--guinda);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2.5rem 1rem; }
    main {
      width: min(100%, 760px);
      margin: 0 auto;
      overflow: hidden;
      background: var(--crema);
      border-radius: .9rem;
      box-shadow: 0 22px 50px #22060d73;
    }
    .card-head {
      padding: clamp(1.4rem, 4vw, 2.2rem) clamp(1.25rem, 4vw, 2.5rem);
      background: var(--guinda-oscuro);
      border-bottom: 3px solid var(--dorado);
      color: var(--crema);
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      letter-spacing: .01em;
    }
    .intro { margin: .45rem 0 0; color: #e9d9cf; }
    .card-body { padding: clamp(1.25rem, 4vw, 2.5rem); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .section-title {
      grid-column: 1 / -1;
      margin: .9rem 0 -.2rem;
      padding-bottom: .4rem;
      border-bottom: 1px solid var(--dorado);
      color: var(--guinda);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .section-title:first-child { margin-top: 0; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: .35rem; font-weight: 650; }
    input, select {
      width: 100%;
      min-height: 2.8rem;
      padding: .65rem .75rem;
      border: 1px solid var(--borde);
      border-radius: .45rem;
      background: #fff;
      color: inherit;
      font: inherit;
    }
    input:focus, select:focus { outline: 3px solid #ecc9d0; border-color: var(--guinda); }
    .hint { margin: .3rem 0 0; color: var(--tinta-suave); font-size: .82rem; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--borde);
    }
    button {
      min-height: 2.8rem;
      padding: .65rem 1.1rem;
      border: 1px solid var(--guinda);
      border-radius: .45rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button[type="submit"] { background: var(--guinda); color: var(--crema); }
    button[type="submit"]:hover { background: var(--guinda-oscuro); }
    button[type="reset"] { background: transparent; color: var(--guinda); }
    button[type="reset"]:hover { background: #f3e6e2; }
    #formStatus { margin: 1rem 0 0; color: var(--guinda); }
    #formStatus:empty { display: none; }
    .notice {
      margin: 0;
      padding: 1rem;
      border-left: 3px solid var(--dorado);
      border-radius: .35rem;
      background: #f3e8de;
      color: var(--tinta);
    }
    @media (max-width: 560px) {
      body { padding: 1rem .65rem; }
      .grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header class="card-head">
      <h1>Formulario de datos</h1>
      <p class="intro" id="intro" hidden>Completa los campos y presiona «Enviar formulario».</p>
    </header>
    <div class="card-body">
    <p class="notice" id="accessStatus" role="status" aria-live="polite">Cargando...</p>

    <form id="datosForm" hidden>
      <input type="hidden" name="codigo" id="codigo">
      <div class="grid">
        <h2 class="section-title">Datos personales</h2>
        <div class="field full">
          <label for="nombre">Nombre Completo</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name"
            pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]+" required
            title="Escribe únicamente letras y espacios.">
        </div>
        <h2 class="section-title">Domicilio</h2>
        <div class="field full">
          <label for="calle">Calle</label>
          <input id="calle" name="calle" type="text" autocomplete="address-line1"
            pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]+" required
            title="Escribe únicamente letras y espacios.">
        </div>
        <div class="field">
          <label for="numero">Número</label>
          <input id="numero" name="numero" type="text" inputmode="numeric"
            pattern="[0-9]+" required data-positive
            title="Escribe un número entero mayor que 0.">
        </div>
        <div class="field">
          <label for="interior">Número interior</label>
          <input id="interior" name="interior" type="text" autocomplete="address-line2"
            pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]+" data-positive
            title="Usa únicamente letras o números; si escribes solo números, deben ser mayores que 0.">
          <p class="hint">Opcional. Puedes dejarlo vacío si no aplica.</p>
        </div>
        <div class="field full">
          <label for="colonia">Colonia o Fraccionamiento</label>
          <input id="colonia" name="colonia" type="text"
            pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 .,#\-]+" required
            title="Usa letras, números, espacios y los signos . , # -">
        </div>
        <div class="field">
          <label for="postal">Número postal</label>
          <input id="postal" name="postal" type="text" inputmode="numeric"
            pattern="[0-9]{1,5}" maxlength="5" required data-positive
            title="Escribe de 1 a 5 dígitos y un valor mayor que 0.">
        </div>
        <div class="field">
          <label for="municipio">Municipio</label>
          <select id="municipio" name="municipio" autocomplete="address-level2" required>
            <option value="" selected disabled>Selecciona tu municipio</option>
            <option>Aguascalientes</option>
            <option>Asientos</option>
            <option>Calvillo</option>
            <option>Cosío</option>
            <option>El Llano</option>
            <option>Jesús María</option>
            <option>Pabellón de Arteaga</option>
            <option>Rincón de Romos</option>
            <option>San Francisco de los Romo</option>
            <option>San José de Gracia</option>
            <option>Tepezalá</option>
          </select>
        </div>
        <h2 class="section-title">Credencial para votar</h2>
        <div class="field full">
          <label for="clave">Clave de elector</label>
          <input id="clave" name="clave" type="text" minlength="18" maxlength="18"
            pattern="[A-Za-z0-9]{18}" required
            title="Escribe exactamente 18 caracteres, solo letras y números.">
        </div>
        <div class="field">
          <label for="seccion">Sección</label>
          <input id="seccion" name="seccion" type="text" inputmode="numeric"
            pattern="[0-9]{1,4}" maxlength="4" required data-positive
            title="Escribe de 1 a 4 dígitos y un valor mayor que 0.">
        </div>
        <div class="field">
          <label for="ocr">OCR</label>
          <input id="ocr" name="ocr" type="text" inputmode="numeric"
            pattern="[0-9]{13}" minlength="13" maxlength="13" required data-positive
            title="Escribe exactamente 13 dígitos y un valor mayor que 0.">
        </div>
        <h2 class="section-title">Contacto</h2>
        <div class="field">
          <label for="telefono">Número de Teléfono</label>
          <input id="telefono" name="telefono" type="tel" autocomplete="tel"
            inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10"
            required data-positive title="Escribe exactamente 10 dígitos y un valor mayor que 0.">
        </div>
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required
            title="Escribe un correo válido (por ejemplo, nombre@dominio.com).">
        </div>
      </div>
      <div class="actions">
        <button type="submit">Enviar formulario</button>
        <button type="reset">Limpiar</button>
      </div>
      <p id="formStatus" role="status" aria-live="polite"></p>
    </form>
    </div>
  </main>
  <script>
    "use strict";

    var positiveFields = document.querySelectorAll("[data-positive]");
    var form = document.getElementById("datosForm");
    var formStatus = document.getElementById("formStatus");
    var intro = document.getElementById("intro");
    var accessStatus = document.getElementById("accessStatus");
    // Apps Script decide en doGet si el enlace es válido y lo escribe aquí.
    var accessState = <?!= JSON.stringify(estado) ?>;
    var accessCode = <?!= JSON.stringify(codigo) ?>;
    var ACCESS_ERRORS = {
      falta: "Este formulario es privado. Ábrelo con el enlace personal que te enviaron.",
      invalido: "Este enlace no es válido. Pide un enlace nuevo a quien te envió el formulario.",
      usado: "Este enlace ya se utilizó para enviar datos. Si necesitas corregir algo, pide un enlace nuevo."
    };


    function validatePositiveField(field) {
      var value = field.value;
      field.setCustomValidity(
        value && Number(value) <= 0 ? "El valor debe ser mayor que 0." : ""
      );
    }

    positiveFields.forEach(function(field) {
      field.addEventListener("input", function() {
        validatePositiveField(field);
      });
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      positiveFields.forEach(validatePositiveField);
      if (!form.reportValidity()) return;

      var submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      formStatus.textContent = "Enviando datos...";

      var datos = {};
      new FormData(form).forEach(function(value, key) { datos[key] = value; });

      enviar(datos, 0, function(result) {
        submitButton.disabled = false;
        if (result.ok) {
          form.hidden = true;
          intro.hidden = true;
          showAccessMessage("¡Gracias! Tus datos se enviaron correctamente.");
        } else if (result.error === "usado" || result.error === "invalido") {
          form.hidden = true;
          intro.hidden = true;
          showAccessMessage(ACCESS_ERRORS[result.error]);
        } else {
          formStatus.textContent = result.message ||
            "No se pudieron enviar los datos. Revisa tu conexión e inténtalo de nuevo.";
        }
      });
    });

    // Si Google está saturado (muchos envíos a la vez) reintenta hasta 8 veces (poco más de 1 minuto)
    // con esperas crecientes. Un «usado» tras un reintento significa que el
    // intento anterior sí se guardó aunque no llegó la respuesta.
    var MAX_REINTENTOS = 8;
    function enviar(datos, intento, listo) {
      function reintentar() {
        if (intento >= MAX_REINTENTOS) {
          listo({ ok: false });
          return;
        }
        formStatus.textContent = "Hay mucha gente enviando, reintentando...";
        setTimeout(function() {
          enviar(datos, intento + 1, listo);
        }, Math.min(1500 * Math.pow(2, intento), 15000) + Math.random() * 2000);
      }
      google.script.run
        .withSuccessHandler(function(result) {
          result = result || {};
          if (result.error === "ocupado") return reintentar();
          if (result.error === "usado" && intento > 0) result = { ok: true };
          listo(result);
        })
        .withFailureHandler(reintentar)
        .enviarDatos(datos);
    }

    function showAccessMessage(text) {
      accessStatus.textContent = text;
      accessStatus.hidden = false;
    }

    function showAccess() {
      if (accessState !== "ok") {
        showAccessMessage(ACCESS_ERRORS[accessState] || ACCESS_ERRORS.invalido);
        return;
      }
      document.getElementById("codigo").value = accessCode;
      accessStatus.hidden = true;
      intro.hidden = false;
      form.hidden = false;
    }

    form.addEventListener("reset", function() {
      formStatus.textContent = "";
      positiveFields.forEach(function(field) {
        field.setCustomValidity("");
      });
    });

    showAccess();
  </script>
</body>
</html>
